name: Source, simulation and LaTeX checks

on:
  push:
    branches: [main]
    paths-ignore: [README.md, PROGRESS.md, TODO.md, references.md]
  pull_request:
    paths-ignore: [README.md, PROGRESS.md, TODO.md, references.md]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: realmotion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-10-18
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, resolved 2026-10-18
        with:
          python-version: '3.13.5'
      - name: Configure per-run plotting cache
        run: echo "MPLCONFIGDIR=${RUNNER_TEMP}/matplotlib" >> "$GITHUB_ENV"
      - run: python -m pip install -r requirements-dev.txt
      - name: Repository source-only policy
        run: python scripts/check_repository.py
      - name: Static compilation and numerical/reentry/runtime tests
        run: |
          python -m compileall -q realmotion scripts tests
          python -m pytest -q
      - name: All experiments and plotting smoke test
        run: python -m realmotion --config configs/smoke.toml
      - name: Verify no tracked generated products or source modifications
        run: |
          python scripts/check_repository.py
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

  latex:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-10-18
        with:
          persist-credentials: false
      - name: Install XeLaTeX, Chinese fonts and latexmk
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-lang-chinese texlive-fonts-recommended latexmk
      - name: Check required TeX font assets
        run: |
          kpsewhich pzdr.tfm
          kpsewhich FandolSong-Regular.otf
      - name: Compile standalone ctexart without shell escape
        run: latexmk -xelatex -interaction=nonstopmode -halt-on-error -file-line-error theory.tex
      - name: Check final log and source-only policy
        run: |
          python3 scripts/check_latex_log.py build/theory.log
          python3 scripts/check_repository.py
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Upload verified theory PDF (1-day retention)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7, pinned
        with:
          name: RealMotion-theory
          path: build/theory.pdf
          if-no-files-found: error
          retention-days: 1
# No scheduled polling, write token or large runner. Only the verified PDF is
# uploaded as a short-lived Actions artifact; it remains excluded from Git.
